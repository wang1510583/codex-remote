<!doctype html>
<html lang="zh-CN" class="remotePageRoot">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#111827" />
    <title>服务器Codex</title>
    <link rel="manifest" href="site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260809-auto-approval-notifications" />
  </head>
  <body class="remotePage">
    <main class="remoteApp">
      <header class="remoteTop">
        <div class="remoteTitle">
          <span id="remoteStatusIcon" class="remoteStatusIcon status-connecting" title="连接中">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </span>
          <span class="remoteMetaStack">
            <span id="remoteMeta">连接中...</span>
            <span class="remoteSubline">
              <span id="remoteMode" class="remoteMode">队列模式</span>
              <span class="queueWrap">
                <button id="queueRemote" class="queueButton" type="button" hidden>队列 0</button>
                <div id="queuePanel" class="queuePanel" hidden></div>
              </span>
            </span>
          </span>
        </div>
        <div class="topActions">
          <button id="usageRemote" class="iconButton" type="button" title="使用量" aria-label="使用量">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="19" x2="4" y2="10"/><line x1="10" y1="19" x2="10" y2="5"/><line x1="16" y1="19" x2="16" y2="13"/><line x1="22" y1="19" x2="22" y2="3"/></svg>
          </button>
          <button id="modelSettingsRemote" class="iconButton" type="button" title="模型与思考强度" aria-label="模型与思考强度">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
          </button>
          <button id="sshConnectRemote" class="iconButton" type="button" title="ssh连接" aria-label="ssh连接">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2" ry="2"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="7 15 10 12 7 9"/><line x1="13" y1="15" x2="17" y2="15"/></svg>
          </button>
          <button id="filesRemote" class="iconButton" type="button" title="项目文件夹" aria-label="项目文件夹">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button id="connectorsRemote" class="iconButton" type="button" title="被控电脑" aria-label="被控电脑">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="14" height="11" rx="2" ry="2"/><rect x="8" y="10" width="14" height="11" rx="2" ry="2"/></svg>
          </button>
          <button id="threadRemote" class="iconButton" type="button" title="会话" aria-label="会话">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="12" x2="14" y2="12"/></svg>
          </button>
        </div>
      </header>

      <aside id="usagePanel" class="filePanel usagePanel" hidden>
        <div class="filePanelTop">
          <strong>使用量</strong>
          <div class="panelActions">
            <button id="closeUsage" type="button">关闭</button>
          </div>
        </div>
        <div id="usageContent" class="usageContent">
          <div class="remoteEvent">正在刷新使用量...</div>
        </div>
        <div id="usageStatus" class="remoteEvent" aria-live="polite"></div>
      </aside>

      <aside id="modelSettingsPanel" class="filePanel modelSettingsPanel" hidden>
        <div class="filePanelTop">
          <strong>模型与思考强度</strong>
          <div class="panelActions">
            <button id="closeModelSettings" type="button">关闭</button>
          </div>
        </div>
        <div id="modelSettingsCurrent" class="modelSettingsCurrent">正在读取当前会话...</div>
        <section class="modelSettingsSection">
          <div class="modelSettingsLabel">模型</div>
          <div id="modelSettingsModels" class="modelSettingsModels"></div>
        </section>
        <section class="modelSettingsSection">
          <div class="modelSettingsLabel">思考强度</div>
          <div id="modelSettingsEfforts" class="modelSettingsEfforts"></div>
        </section>
        <div id="modelSettingsStatus" class="remoteEvent" aria-live="polite"></div>
      </aside>

      <aside id="sshConnectPanel" class="filePanel" hidden>
        <div class="filePanelTop">
          <strong id="sshPanelTitle">ssh连接</strong>
          <div class="panelActions">
            <button id="toggleSshView" type="button">ssh电脑</button>
            <button id="closeSshConnect" type="button">关闭</button>
          </div>
        </div>
        <form id="sshConnectForm" class="sshConnectForm" data-ssh-view="config">
          <label>
            <span>用户</span>
            <input id="sshTarget" class="loginInput" type="text" placeholder="ssh 用户名@主机名" autocomplete="off" />
          </label>
          <label>
            <span>密码</span>
            <input id="sshPassword" class="loginInput" type="password" placeholder="SSH 密码" autocomplete="current-password" />
          </label>
          <div class="panelActions">
            <button id="sshConnectSubmit" class="primary" type="submit">连接</button>
            <button id="sshDisconnect" type="button">断开</button>
            <span id="sshStatus" class="remoteEvent">未连接</span>
          </div>
        </form>
        <div id="sshFilesView" data-ssh-view="files" hidden>
          <div class="panelActions">
            <button id="createSshFolder" type="button">新建文件夹</button>
            <button id="createSshFile" type="button">新建文件</button>
          </div>
          <div id="sshPath" class="filePath"></div>
          <div id="sshList" class="fileList"></div>
          <div id="sshPreview" class="filePreview" hidden></div>
        </div>
      </aside>
      <aside id="connectorPanel" class="filePanel" hidden>
        <div class="filePanelTop">
          <strong>被控电脑</strong>
          <div class="panelActions">
            <button id="refreshConnectors" type="button">刷新</button>
            <button id="closeConnectors" type="button">关闭</button>
          </div>
        </div>
        <div class="connectorHint">选择要控制的电脑，切换后会话与文件随之切换。</div>
        <div id="connectorList" class="connectorList"></div>
      </aside>



      <aside id="threadPanel" class="threadPanel" hidden>
        <div class="threadPanelTop">
          <strong id="threadPanelTitle">选择已有会话</strong>
          <div class="panelActions">
            <button id="toggleThreadView" type="button">新建会话</button>
            <button id="closeThreads" type="button">关闭</button>
          </div>
        </div>
        <div id="threadExistingView">
          <div id="threadList" class="threadList"></div>
        </div>
        <div id="threadNewView" hidden>
          <div id="newPath" class="filePath"></div>
          <div id="newList" class="fileList"></div>
          <div class="newSessionActions">
            <button id="createSessionRemote" class="primary" type="button">在当前文件夹创建会话</button>
          </div>
        </div>
      </aside>

      <aside id="filePanel" class="filePanel" hidden>
        <div class="filePanelTop">
          <strong>项目文件夹</strong>
          <div class="panelActions">
            <div class="projectUploadPicker">
              <button id="uploadProjectRemote" type="button" aria-haspopup="true" aria-expanded="false">上传</button>
              <div id="projectUploadMenu" class="projectUploadMenu" hidden>
                <button id="selectProjectFilesRemote" type="button">选择文件</button>
                <button id="selectProjectFolderRemote" type="button">选择文件夹</button>
              </div>
              <input id="projectFilesRemote" type="file" multiple hidden />
              <input id="projectFolderRemote" type="file" webkitdirectory directory multiple hidden />
            </div>
            <button id="createFolderRemote" type="button">新建文件夹</button>
            <button id="createFileRemote" type="button">新建文件</button>
            <button id="closeFiles" type="button">关闭</button>
          </div>
        </div>
        <div id="filePath" class="filePath"></div>
        <div id="projectUploadStatus" class="projectUploadStatus" role="status" aria-live="polite" hidden></div>
        <div id="fileList" class="fileList"></div>
        <div id="filePreview" class="filePreview" hidden></div>
      </aside>

      <section class="remoteLogWrap">
        <button id="loadMoreMessages" class="loadMoreMessages" type="button" hidden>加载更多</button>
        <div id="remoteLog" class="remoteLog" aria-live="polite"></div>
      </section>

      <div class="scrollJumpLayer">
        <button id="scrollTopRemote" class="scrollJump scrollJumpTop" type="button" title="回到顶部" aria-label="回到顶部" hidden>
          <svg class="scrollJumpIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
        <button id="scrollBottomRemote" class="scrollJump scrollJumpBottom" type="button" title="回到底部" aria-label="回到底部" hidden>
          <svg class="scrollJumpIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
      </div>

      <form id="remoteForm" class="remoteComposer">
        <div class="commandPicker">
          <div class="commandQuickList" aria-label="Codex 快捷命令">
            <button id="slashRemote" class="slashButton" type="button" title="显示 Codex / 命令" aria-label="显示 Codex / 命令">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="4" x2="6" y2="20"/></svg>
            </button>
          </div>
          <div id="commandMenu" class="commandMenu" hidden>
            <div class="commandMenuTop">
              <strong>Codex / 命令与 Mem0</strong>
              <span>Mem0 技能点击后直接执行</span>
            </div>
            <div id="commandList" class="commandList"></div>
          </div>
        </div>
        <button id="uploadRemote" class="fileButton" type="button" title="上传文件" aria-label="上传文件">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <input id="fileRemote" type="file" multiple hidden />
        <textarea id="remoteInput" rows="1" inputmode="text" enterkeyhint="send" spellcheck="false"></textarea>
        <button id="sendQueueRemote" class="iconButton" type="button" title="队列模式发送（备用）" aria-label="队列模式发送">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><polyline points="3 4 3 20 6 17"/></svg>
        </button>
        <button id="sendSteerRemote" class="iconButton primary" type="submit" title="引导模式发送（默认，Ctrl+Enter）" aria-label="引导模式发送（默认）">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <div id="uploadList" class="uploadList" hidden></div>
      </form>
    </main>
    <div id="approvalModal" class="approvalModal" role="dialog" aria-modal="true" aria-labelledby="approvalTitle" hidden>
      <div class="approvalDialog">
        <header class="approvalTop">
          <div>
            <span id="approvalKind" class="approvalKind">确认</span>
            <h2 id="approvalTitle" class="approvalTitle">Codex 请求确认</h2>
          </div>
          <span id="approvalMeta" class="approvalMeta"></span>
        </header>
        <div id="approvalBody" class="approvalBody"></div>
        <div id="approvalActions" class="approvalActions"></div>
        <div id="approvalStatus" class="approvalStatus" aria-live="polite"></div>
      </div>
    </div>
    <script src="pwa.js"></script>
    <script src="remote.js?v=20260809-auto-approval-notifications"></script>
  </body>
</html>
